<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ozod — qarzlardan ozod boʻling</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#0a0f1c;--bg2:#0f1729;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);
  --text:#e8eef9;--muted:#8b98b0;--acc:#34d399;--acc2:#22d3ee;--red:#fb7185;--yel:#fbbf24;--vio:#a78bfa;
  --r:20px;--grad:linear-gradient(135deg,#34d399,#22d3ee);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{min-height:100vh;background:radial-gradient(900px 500px at 100% -10%,rgba(34,211,238,.13),transparent 60%),radial-gradient(700px 500px at -10% 10%,rgba(52,211,153,.12),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 20px rgba(34,211,238,.3)}
.brand h1{font-size:20px;margin:0;letter-spacing:.3px}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
.hero{background:linear-gradient(145deg,rgba(52,211,153,.18),rgba(34,211,238,.08) 60%,rgba(167,139,250,.1));border-color:rgba(52,211,153,.25)}
.label{color:var(--muted);font-size:13px}
.big{font-size:30px;font-weight:750;letter-spacing:-.5px;margin:4px 0}
.mid{font-size:19px;font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat .v{font-weight:700;font-size:16px;margin-top:4px;word-break:break-word}
.g{color:var(--acc)}.r{color:var(--red)}.y{color:var(--yel)}.m{color:var(--muted)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s}
h2{font-size:17px;margin:22px 4px 10px}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.ava{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:rgba(255,255,255,.06)}
.grow{flex:1;min-width:0}
.ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07)}
.chip.red{background:rgba(251,113,133,.15);color:var(--red)}
.chip.yel{background:rgba(251,191,36,.15);color:var(--yel)}
.chip.grn{background:rgba(52,211,153,.15);color:var(--acc)}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:650;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.btn.pri{background:var(--grad);color:#05222a;border:0;box-shadow:0 8px 24px rgba(34,211,238,.25)}
.btn.sm{padding:8px 11px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--red)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(10,15,28,.85);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;cursor:pointer}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--acc)}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom));z-index:21;width:56px;height:56px;border-radius:18px;border:0;background:var(--grad);color:#05222a;font-size:30px;box-shadow:0 10px 30px rgba(34,211,238,.4);cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet h3{margin:4px 0 14px;font-size:18px}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.18);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input.i,select.i,textarea.i{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--acc2)}
select.i option{background:#111a2e}
.seg{display:flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:rgba(255,255,255,.1);color:var(--text)}
.check{display:flex;align-items:center;gap:10px;margin:6px 0 14px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:#34d399}
canvas{width:100%;display:block}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{font-size:42px;margin-bottom:6px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;margin-bottom:10px;border:1px solid}
.alert.red{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3)}
.alert.yel{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.28)}
.alert.grn{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.28)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.5;white-space:normal;word-wrap:break-word}
.msg.u{align-self:flex-end;background:var(--grad);color:#05222a;border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.composer{display:flex;gap:8px;position:sticky;bottom:calc(82px + env(safe-area-inset-bottom))}
.composer input{flex:1}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.sugg button{white-space:nowrap}
.insight{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border:0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#132036;border:1px solid var(--line);padding:11px 16px;border-radius:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:fade .2s;max-width:90%}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
.timeline .item .num{width:28px;height:28px;border-radius:9px;background:var(--grad);color:#05222a;font-weight:800;display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#05222a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 5-6"/></svg></div>
      <div><h1>Ozod</h1><small>shaxsiy moliyaviy yordamchi</small></div>
    </div>
    <button class="iconbtn" data-act="settings" aria-label="Sozlamalar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>

<button class="fab" data-act="fab" aria-label="Qoʻshish">+</button>

<nav class="tabs"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Asosiy</button>
  <button data-tab="debts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Qarzlar</button>
  <button data-tab="money"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M17 7H9M17 7v8"/></svg>Kirim-chiqim</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Reja</button>
  <button data-tab="ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/><path d="M19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>AI</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
/* ====== Holat va saqlash ====== */
const LS='ozod-data-v1';
function defaults(){return{debts:[],tx:[],chat:[],settings:{cur:'soʻm',strategy:'avalanche',extra:null,aiKey:'',aiModel:'gemini-3.8-flash',notified:{},name:''}};}
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d){const b=defaults();return{...b,...d,settings:{...b.settings,...(d.settings||{})}};}}catch(e){}return defaults();}
let S=load();
if(/^gemini-(1\.|2\.)/.test(S.settings.aiModel||'')){S.settings.aiModel='gemini-3.8-flash';}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}

/* ====== Yordamchilar ====== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const fmt=n=>{n=Math.round(+n||0);const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');return(n<0?'−':'')+s;};
const money=n=>fmt(n)+' '+S.settings.cur;
const short=n=>{const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1)+' mlrd';if(a>=1e6)return(n/1e6).toFixed(1)+' mln';if(a>=1e4)return Math.round(n/1e3)+' ming';return fmt(n);};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const MSHORT=['Yan','Fev','Mar','Apr','May','Iyn','Iyl','Avg','Sen','Okt','Noy','Dek'];
const mLabel=k=>{const[y,m]=k.split('-');return MONTHS[+m-1]+' '+y;};
const addMonths=(k,n)=>{let[y,m]=k.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return`${y}-${pad(m)}`;};
const num=v=>{const x=parseFloat(String(v??'').replace(/[\s ]/g,'').replace(',','.'));return isFinite(x)?x:0;};
const dateUz=d=>`${d.getDate()}-${MONTHS[d.getMonth()].toLowerCase()}`;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}

const INC_CATS=['Maosh','Biznes','Frilans','Sovgʻa','Boshqa daromad'];
const EXP_CATS=['Oziq-ovqat','Transport','Uy-joy / ijara','Kommunal','Aloqa / internet','Sogʻliq','Kiyim','Taʼlim','Koʻngilochar','Qarz toʻlovi','Boshqa'];
const CAT_ICON={'Maosh':'💼','Biznes':'🏪','Frilans':'💻','Sovgʻa':'🎁','Boshqa daromad':'💰','Oziq-ovqat':'🛒','Transport':'🚕','Uy-joy / ijara':'🏠','Kommunal':'💡','Aloqa / internet':'📱','Sogʻliq':'💊','Kiyim':'👕','Taʼlim':'📚','Koʻngilochar':'🎬','Qarz toʻlovi':'💳','Boshqa':'📦'};

/* ====== Hisob-kitob ====== */
function txInMonth(k){
  const cur=mkey(new Date());
  return S.tx.filter(t=>{const tk=t.date.slice(0,7);if(tk===k)return true;return t.recurring&&tk<k&&k<=cur;})
    .map(t=>t.date.slice(0,7)===k?t:{...t,virtual:true});
}
function monthTotals(k){let inc=0,exp=0;const cats={};txInMonth(k).forEach(t=>{if(t.type==='income')inc+=t.amount;else{exp+=t.amount;cats[t.category]=(cats[t.category]||0)+t.amount;}});return{inc,exp,bal:inc-exp,cats};}
function avgMonthly(n=3){
  const cur=mkey(new Date());const data=[];
  for(let i=0;i<n;i++){const t=monthTotals(addMonths(cur,-i));if(t.inc||t.exp)data.push(t);}
  if(!data.length)return{inc:0,exp:0,n:0};
  return{inc:data.reduce((s,t)=>s+t.inc,0)/data.length,exp:data.reduce((s,t)=>s+t.exp,0)/data.length,n:data.length};
}
const activeDebts=()=>S.debts.filter(d=>d.remaining>0.5);
const totalDebt=()=>activeDebts().reduce((s,d)=>s+d.remaining,0);
const totalMin=()=>activeDebts().reduce((s,d)=>s+(d.minPay||0),0);

function nextDue(d){
  if(!d.dueDay||d.remaining<=0.5)return null;
  const now=today();
  const mk=(y,m)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d.dueDay,last));};
  const paidThis=(d.payments||[]).filter(p=>p.date.slice(0,7)===mkey(now)).reduce((s,p)=>s+p.amount,0);
  const paidEnough=d.minPay>0?paidThis>=d.minPay:paidThis>0;
  let due=mk(now.getFullYear(),now.getMonth());let overdue=false;
  if(paidEnough)due=mk(now.getFullYear(),now.getMonth()+1);
  else if(due<now)overdue=true;
  return{date:due,days:Math.round((due-now)/864e5),overdue};
}
function dueText(n){if(!n)return'';if(n.overdue)return`${-n.days} kun kechikdi!`;if(n.days===0)return'Bugun toʻlash kerak';if(n.days===1)return'Ertaga';return`${n.days} kundan keyin · ${dateUz(n.date)}`;}
function dueChip(n){if(!n)return'';const c=n.overdue||n.days<=1?'red':n.days<=5?'yel':'grn';return`<span class="chip ${c}">${esc(dueText(n))}</span>`;}

function simulate(strategy,extra){
  const ds=activeDebts().map(d=>({id:d.id,name:d.name,bal:d.remaining,rate:(d.rate||0)/100/12,min:Math.max(d.minPay||0,0),done:0}));
  if(!ds.length)return{months:0,interest:0,order:[],series:[0],budget:0,stuck:false};
  const budget=ds.reduce((s,d)=>s+d.min,0)+Math.max(0,extra||0);
  let m=0,interest=0;const order=[],series=[ds.reduce((s,d)=>s+d.bal,0)];
  while(ds.some(d=>d.bal>0.5)&&m<600){
    m++;
    ds.forEach(d=>{if(d.bal>0.5){const i=d.bal*d.rate;d.bal+=i;interest+=i;}});
    let avail=budget;
    ds.forEach(d=>{if(d.bal>0.5){const p=Math.min(d.min,d.bal,avail);d.bal-=p;avail-=p;}});
    const act=ds.filter(d=>d.bal>0.5).sort(strategy==='avalanche'?(a,b)=>(b.rate-a.rate)||(a.bal-b.bal):(a,b)=>a.bal-b.bal);
    for(const d of act){if(avail<=0)break;const p=Math.min(avail,d.bal);d.bal-=p;avail-=p;}
    ds.forEach(d=>{if(d.bal<=0.5&&!d.done){d.done=m;d.bal=0;order.push({name:d.name,month:m});}});
    series.push(ds.reduce((s,d)=>s+d.bal,0));
  }
  return{months:m,interest,order,series,budget,stuck:m>=600};
}
function suggestedExtra(){const a=avgMonthly(3);return Math.max(0,Math.round(a.inc-a.exp));}
function getExtra(){return S.settings.extra==null?suggestedExtra():S.settings.extra;}
function freeDate(months){const d=new Date();d.setMonth(d.getMonth()+months);return MONTHS[d.getMonth()]+' '+d.getFullYear();}
function monthsText(m){const y=Math.floor(m/12),r=m%12;return[y?y+' yil':'',r?r+' oy':''].filter(Boolean).join(' ')||'0 oy';}

/* ====== Mahalliy tahlil (oflayn AI) ====== */
function insights(){
  const out=[];const k=mkey(new Date());const t=monthTotals(k);const av=avgMonthly(3);
  const inc=av.inc||t.inc;const debts=activeDebts();
  // kechikkan va yaqin toʻlovlar
  debts.forEach(d=>{const n=nextDue(d);if(n&&(n.overdue||n.days<=3))out.push({i:n.overdue?'⛔':'⏰',tone:'red',t:`${d.name}: ${dueText(n)}`,x:`Minimal toʻlov: ${money(d.minPay||0)}. Kechiksangiz jarima va foiz oshishi mumkin.`});});
  if(inc>0){
    const rate=(inc-(av.exp||t.exp))/inc;
    if(rate<0)out.push({i:'📉',tone:'red',t:'Xarajat daromaddan oshib ketyapti',x:`Oʻrtacha har oy ${money(-(inc-av.exp))} kamomad. Avval xarajatlarni qisqartirish kerak, aks holda yangi qarz paydo boʻladi.`});
    else if(rate<0.1)out.push({i:'⚠️',tone:'yel',t:`Jamgʻarma darajasi past: ${Math.round(rate*100)}%`,x:'Daromadning kamida 10–20% qismini qarz toʻlash yoki jamgʻarmaga ajratishga harakat qiling.'});
    else out.push({i:'✅',tone:'grn',t:`Yaxshi! Daromadning ${Math.round(rate*100)}% qismi ortib qolyapti`,x:'Shu ortiqcha pulni eng qimmat qarzga yoʻnaltirsangiz, qarzdan tezroq qutulasiz.'});
    const dti=totalMin()/inc;
    if(debts.length&&dti>0.36)out.push({i:'🧯',tone:'red',t:`Qarz yuki yuqori: daromadning ${Math.round(dti*100)}%`,x:'Oylik majburiy toʻlovlar daromadning 36% dan oshmasligi tavsiya qilinadi. Yangi qarz olmang, imkon boʻlsa qayta tuzish (restrukturizatsiya) haqida bank bilan gaplashing.'});
  }
  // eng katta xarajat toifasi
  const cats=Object.entries(t.cats).filter(([c])=>c!=='Qarz toʻlovi').sort((a,b)=>b[1]-a[1]);
  if(cats.length&&debts.length){
    const[c,v]=cats[0];const cut=Math.round(v*0.15);const base=simulate(S.settings.strategy,getExtra());const fast=simulate(S.settings.strategy,getExtra()+cut);
    const saved=base.months-fast.months;
    out.push({i:CAT_ICON[c]||'💡',tone:'yel',t:`Eng katta xarajat: ${c} (${money(v)})`,x:`Buni 15% ga (${money(cut)}) qisqartirib, qarzga yoʻnaltirsangiz${saved>0?` qarzdan <b>${monthsText(saved)}</b> oldinroq qutulasiz`:' foizlarni tejaysiz'}.`});
  }
  // eng qimmat qarz
  const hi=[...debts].sort((a,b)=>(b.rate||0)-(a.rate||0))[0];
  if(hi&&hi.rate>0)out.push({i:'🔥',tone:'yel',t:`Eng qimmat qarz: ${hi.name} (${hi.rate}% yillik)`,x:`Har oy taxminan ${money(hi.remaining*hi.rate/1200)} faqat foizga ketyapti. Qoʻshimcha pulni birinchi shunga bering.`});
  if(debts.length){const p=simulate(S.settings.strategy,getExtra());
    if(p.stuck)out.push({i:'🚨',tone:'red',t:'Hozirgi toʻlovlar bilan qarz kamaymaydi',x:'Oylik toʻlov foizlarni ham qoplamayapti. Toʻlov summasini oshirish zarur.'});
    else out.push({i:'🎯',tone:'grn',t:`Qarzdan ozod boʻlish: ${freeDate(p.months)}`,x:`Oyiga ${money(p.budget)} toʻlasangiz, ${monthsText(p.months)} ichida barcha qarzlar yopiladi.`});}
  if(!S.debts.length&&!S.tx.length)out.push({i:'👋',tone:'grn',t:'Boshlash uchun maʼlumot kiriting',x:'Qarzlaringiz, oylik daromad va xarajatlaringizni qoʻshing — men hisoblab, tahlil qilib beraman.'});
  return out;
}

function render(){

/* ====== Kalendar (.ics) eslatmalari ====== */
function icsEvent(d){
  const n=nextDue(d);const start=n?n.date:new Date();const ds=`${start.getFullYear()}${pad(start.getMonth()+1)}${pad(start.getDate())}`;
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let rr='RRULE:FREQ=MONTHLY';
  if(d.endDate)rr+=';UNTIL='+d.endDate.replace(/-/g,'')+'T235959Z';
  return['BEGIN:VEVENT',`UID:${d.id}@ozod`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${ds}`,rr,
    `SUMMARY:💳 ${d.name} — toʻlov ${fmt(d.minPay||0)} ${S.settings.cur}`,`DESCRIPTION:Ozod: ${d.creditor||''} qarziga oylik toʻlov kuni`,
    'BEGIN:VALARM','TRIGGER:-P1D','ACTION:DISPLAY','DESCRIPTION:Ertaga qarz toʻlovi','END:VALARM',
    'BEGIN:VALARM','TRIGGER:PT9H','ACTION:DISPLAY','DESCRIPTION:Bugun qarz toʻlovi','END:VALARM','END:VEVENT'].join('\r\n');
}
function downloadIcs(list,name){
  if(!list.length){toast('Faol qarz yoʻq');return;}
  const body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ozod//UZ','CALSCALE:GREGORIAN',...list.map(icsEvent),'END:VCALENDAR'].join('\r\n');
  download(new Blob([body],{type:'text/calendar'}),name);toast('Faylni oching — kalendarga qoʻshiladi');
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}

function md(t){let h=esc(t);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*(.+)$/gm,'<b>$1</b>').replace(/^\s*[-*•]\s+/gm,'• ').replace(/\n/g,'<br>');return h;}
function finSummary(){
  const k=mkey(new Date());const t=monthTotals(k);const av=avgMonthly(3);const p=simulate(S.settings.strategy,getExtra());
  return{bugun:ymd(new Date()),valyuta:S.settings.cur,bu_oy:{daromad:Math.round(t.inc),xarajat:Math.round(t.exp),qoldiq:Math.round(t.bal),toifalar:t.cats},

}
function offlineAnswer(q){
  const ins=insights();const ql=q.toLowerCase();let x='';
  if(/qaysi.*(birinchi|avval)|tartib/.test(ql)){const p=simulate(S.settings.strategy,getExtra());x=p.order.length?'Hozirgi strategiya boʻyicha yopilish tartibi:\n'+p.order.map((o,i)=>`${i+1}. **${o.name}** — ${freeDate(o.month)}`).join('\n'):'Hozir faol qarz yoʻq.';}
  else if(/byudjet|budjet/.test(ql)){const a=avgMonthly(3);const inc=a.inc;x=inc?`Oʻrtacha daromadingiz **${money(inc)}**. 50/30/20 qoidasi boʻyicha:\n• Zarur xarajatlar (uy, oziq-ovqat, kommunal): **${money(inc*.5)}**\n• Shaxsiy xarajatlar: **${money(inc*.3)}**\n• Qarz toʻlash va jamgʻarma: **${money(inc*.2)}**\nQarz koʻp boʻlsa, shaxsiy xarajatlarni qisqartirib, qarz ulushini 30% ga chiqaring.`:'Avval daromadlaringizni kiriting, keyin byudjet tuzib beraman.';}
  else x=ins.map(o=>`**${o.i} ${o.t}**\n${o.x.replace(/<\/?b>/g,'**')}`).join('\n\n');
  return x+'\n\n_Toʻliq AI javoblari uchun Sozlamalarda Gemini kalitini kiriting._'.replace(/_/g,'');
}
async function callGemini(sys,contents,tries=0){
  const model=S.settings.aiModel||'gemini-3.8-flash';
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.settings.aiKey},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents})});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){
    const msg=j?.error?.message||('HTTP '+r.status);
    // Google eski modelni oʻchirgan boʻlsa — tavsiya qilingan yangi modelga avtomatik oʻtamiz
    const sug=msg.match(/models\/(gemini-[\w.\-]+)/g);
    const next=sug&&sug.map(s=>s.slice(7)).find(x=>x!==model);
    if(tries<2&&next&&/no longer|not found|deprecat|not supported|update your code/i.test(msg)){S.settings.aiModel=next;save();return callGemini(sys,contents,tries+1);}
    if(tries<1&&r.status===404&&model!=='gemini-3.8-flash'){S.settings.aiModel='gemini-3.8-flash';save();return callGemini(sys,contents,tries+1);}
    if(r.status===429)throw new Error('Bepul limit tugadi, biroz kutib qayta urinib koʻring.');
    throw new Error(msg);
  }
  return(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim()||'Javob olinmadi.';
}
async function sendChat(qq){
  const inp=$('#chatIn');const q=(qq||inp?.value||'').trim();if(!q||aiBusy)return;
  S.chat.push({role:'user',text:q});if(S.chat.length>30)S.chat=S.chat.slice(-30);save();
  if(!S.settings.aiKey){S.chat.push({role:'ai',text:offlineAnswer(q)});save();render();return;}
  aiBusy=true;render();
  const sys=`Sen "Ozod" ilovasidagi shaxsiy moliyaviy maslahatchisan. Faqat oʻzbek tilida (lotin yozuvida), samimiy, aniq va qisqa javob ber. Asosiy maqsad — foydalanuvchiga qarzlardan iloji boricha tez va xavfsiz qutulishga yordam berish. Raqamlarni foydalanuvchi maʼlumotlariga asoslab hisobla, aniq summalar va qadamlar ber. Xavfli moliyaviy maslahat (yangi qarz olib qarz yopish, qimor, kripto spekulyatsiya) berma. Muhim qarorlarda mutaxassis bilan maslahatlashishni eslat.\n\nFoydalanuvchining joriy moliyaviy holati (JSON):\n${JSON.stringify(finSummary())}`;
  const contents=S.chat.slice(-12).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]}));
  try{
    const txt=await callGemini(sys,contents);
    S.chat.push({role:'ai',text:txt});
  }catch(e){S.chat.push({role:'ai',text:'⚠️ AI bilan bogʻlanib boʻlmadi: '+e.message+'\n\nKalitni tekshiring. Hozircha oflayn tahlil:\n\n'+offlineAnswer(q)});}
  aiBusy=false;save();render();
}

/* ====== Grafiklar ====== */
function setupCanvas(cv){const dpr=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const c=cv.getContext('2d');c.scale(dpr,dpr);return{c,w,h};}
function rr(c,x,y,w,h,col){if(h<=0.5)return;c.fillStyle=col;const r=Math.min(5,w/2,h);c.beginPath();c.moveTo(x,y+h);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h);c.closePath();c.fill();}
function drawCharts(){
  const c6=$('#ch6');
  if(c6){const{c,w,h}=setupCanvas(c6);const cur=mkey(new Date());const ks=[];for(let i=5;i>=0;i--)ks.push(addMonths(cur,-i));
    const T=ks.map(monthTotals);const a=T.map(t=>t.inc),b=T.map(t=>t.exp);const max=Math.max(1,...a,...b);const pb=22,pt=8;const gw=w/ks.length;
    c.strokeStyle='rgba(255,255,255,.06)';for(let i=0;i<=3;i++){const y=pt+(h-pb-pt)*i/3;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke();}
    ks.forEach((k,i)=>{const x=i*gw+gw/2;const bw=Math.min(16,(gw-14)/2);
      rr(c,x-bw-2,h-pb-(h-pb-pt)*a[i]/max,bw,(h-pb-pt)*a[i]/max,'#34d399');rr(c,x+2,h-pb-(h-pb-pt)*b[i]/max,bw,(h-pb-pt)*b[i]/max,'#fb7185');
      c.fillStyle=k===cur?'#e8eef9':'#8b98b0';c.font='11px system-ui';c.textAlign='center';c.fillText(MSHORT[+k.slice(5)-1],x,h-6);});}
  const cp=$('#chPlan');
  if(cp&&window._planSeries){const{c,w,h}=setupCanvas(cp);const s=window._planSeries;const max=Math.max(1,...s);const pb=22,pt=10,pl=4;const n=Math.max(1,s.length-1);
    const X=i=>pl+(w-pl*2)*i/n,Y=v=>pt+(h-pb-pt)*(1-v/max);
    const g=c.createLinearGradient(0,pt,0,h-pb);g.addColorStop(0,'rgba(34,211,238,.35)');g.addColorStop(1,'rgba(34,211,238,0)');
    c.beginPath();c.moveTo(X(0),Y(s[0]));s.forEach((v,i)=>c.lineTo(X(i),Y(v)));c.lineTo(X(n),h-pb);c.lineTo(X(0),h-pb);c.closePath();c.fillStyle=g;c.fill();
    c.beginPath();s.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));c.strokeStyle='#22d3ee';c.lineWidth=2.5;c.stroke();
    c.fillStyle='#8b98b0';c.font='11px system-ui';c.textAlign='left';c.fillText('Bugun · '+short(s[0]),2,h-6);c.textAlign='right';c.fillText(freeDate(n),w-2,h-6);}
}
